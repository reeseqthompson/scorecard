<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075783"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Moss Hill"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="logo.png"><title>Moss Hill Golf Club</title><link rel="stylesheet" href="v2.css?v=20261114i"></head><body>
<header class="topbar"><button class="icon-button" id="menuButton" aria-label="Open menu">☰</button><strong>Moss Hill Golf Club</strong><button class="icon-button" id="mapButton" aria-label="Course map"><svg class="map-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg></button></header>
<div class="drawer-backdrop" id="backdrop" aria-hidden="true"></div><aside class="drawer" id="drawer" aria-hidden="true" inert><button data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg><span>Home</span></button><button data-view="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg><span>Map</span></button><button data-view="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-7h4v7"/></svg><span>Statistics</span></button><button data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><span>Playing history</span></button><a href="index.html" id="classicVersion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M19 14v5H5V5h5"/></svg><span>V1 (Classic)</span></a><a href="v3/index.html" id="leagueVersion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M19 14v5H5V5h5"/></svg><span>V3 (Basement Golf League)</span></a><button id="finishRound" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg><span>Finish Round</span></button></aside>
<main>
<section id="home" class="view active"><div class="home-screen"><div class="home-brand"><img src="logo_black.png" alt="Moss Hill Golf Club"></div><div class="home-actions"><button data-view="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg> START</button><button data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg> PLAYING HISTORY</button><button data-view="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-7h4v7"/></svg> STATISTICS</button><button data-view="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg> COURSE MAP</button></div></div><div id="homeRecent" hidden></div></section>
<section id="setup" class="view"><div class="simple-heading"><button data-view="home" aria-label="Back">‹</button><h1>New round</h1><span></span></div><div class="setup-content"><div class="setup-card"><div class="setup-title"><div><h2>Players</h2></div><span class="setup-player-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 13a5 5 0 0 1 3 5v2"/></svg></span></div><div id="setupPlayers"></div><div class="add-player"><input id="setupName" aria-label="Player name" placeholder="Enter player name" maxlength="80" autocomplete="off"><button id="addPlayer">＋ Add</button></div><div id="suggestionSection" hidden><p class="suggestion-label">RECENT PLAYERS</p><div id="playerSuggestions" class="player-suggestions"></div></div><p class="message" id="setupMessage" role="status"></p></div><button class="start-round" id="beginRound">Start round <span>→</span></button></div></section>
<section id="round" class="view"><div class="round-screen"><div id="playerTabs" class="player-tabs" aria-label="Players"></div><div class="score-grid" id="scoreGrid"></div><div hidden><strong id="total"></strong><span id="progress"></span></div><div class="round-arrows"><button id="prevHole">‹ &nbsp; PREV</button><button id="nextHole">NEXT &nbsp; ›</button></div><div class="hole-view"><div hidden><span id="holeNumber"></span><span id="holeCounter"></span></div><div class="map-frame"><img id="holeMap" src="assets/1.png" alt="Map of hole 1"></div></div><div class="score-controls"><div class="stroke-heading"><span>STROKES</span><strong id="strokeValue">—</strong></div><div class="stroke-options" id="strokeOptions"></div></div><div class="round-bottom"><button id="submit">Save round</button><p class="message" id="roundMessage" role="status"></p><span id="totalNote" hidden></span></div></div></section>
<section id="history" class="view"><div class="simple-heading"><button data-view="home" aria-label="Back">‹</button><h1>Playing history</h1><span></span></div><div class="content"><select id="historyFilter" aria-label="Filter by player"><option value="">All players</option></select><div id="historyList"></div></div></section>
<section id="stats" class="view"><div class="simple-heading"><button data-view="home" aria-label="Back">‹</button><h1>Statistics</h1><span></span></div><div class="content"><select id="statsFilter" aria-label="Filter by player"><option value="">All players</option></select><div id="statsContent"></div></div></section>
<section id="map" class="view"><div class="map-full"><img src="assets/all.png" alt="Moss Hill course map showing all nine holes"></div><div class="map-bottom"><button id="mapBack">‹ &nbsp; Back</button></div></section>
</main><script src="v2.js?v=20261114i"></script></body></html>
